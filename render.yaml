# Render Blueprint（放在仓库根目录，Render 默认就在这里找）
#
# ⚠️ 已停用（2026-11）：工作台只跑本地，双击 workbench\run.bat 即可。
#    线上服务 srv-dbkok1nf3r2c73fggbt0 已 suspend、autoDeploy 已关，git push 不会触发重建。
#    需要恢复：Render 控制台点 Resume，或 POST /v1/services/srv-dbkok1nf3r2c73fggbt0/resume，
#    然后把下面的 autoDeploy 改回 true。
#
# 原部署：Render → New → Blueprint → 选仓库 1063663447/picture_auto → Apply
# 然后在 Environment 填 TERRA_API_KEY / DEEPSEEK_API_KEY / FEISHU_APP_ID / FEISHU_APP_SECRET
# （sync: false = 不写进仓库，控制台填）
#
# 免费版限制：无持久盘（重启清 data/）、闲置 15 分钟休眠、512MB 内存。
# 记录库用飞书多维表格（见 workbench/deploy/feishu.md），所以即使 data/ 丢了，
# 「做了什么/多少钱/成品编号」这些在飞书里仍然留痕。

services:
  - type: web
    name: apparel-recolor-workbench
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./workbench/deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: WORKBENCH_HOST
        value: 0.0.0.0
      - key: WORKBENCH_DEPLOYED
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      # 有付费持久盘时打开，并挂到 /data
      # - key: WORKBENCH_DATA_DIR
      #   value: /data
      - key: TERRA_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      # 登录会话签名密钥（随便一串长的随机字符；不设就回退 config.json）
      - key: WORKBENCH_SESSION_SECRET
        sync: false
