<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理后台 · 生图工作台</title>
<link rel="stylesheet" href="/style.css?v=7.6.1" />
<link rel="stylesheet" href="/glass.css?v=7.6.1" />
<link rel="stylesheet" href="/aurora.css?v=7.6.1" />
<style>
  .admin-shell { max-width: 1180px; margin: 0 auto; padding: var(--sp-4) var(--sp-4) 64px; display: grid; gap: var(--sp-4); }
  .admin-shell h2 { font-size: 14px; margin: 0; }
  .panel {
    position: relative; overflow: hidden; border-radius: var(--r-lg);
    background: var(--glass); border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(18px) saturate(145%);
    backdrop-filter: blur(18px) saturate(145%);
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 12px 34px -24px rgba(6, 32, 25, .5);
    animation: rise .5s var(--ease-spring) both;
  }
  .panel::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 1px;
    background: linear-gradient(90deg, transparent 4%, color-mix(in srgb, var(--primary) 55%, transparent) 40%, transparent 96%);
    opacity: .7; pointer-events: none;
  }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px;
    border-bottom: 1px solid var(--glass-line);
    background: linear-gradient(180deg, var(--glass-hi), transparent); }
  .panel-head .hint { margin-left: auto; }
  .panel-body { padding: 12px 14px; }
  .kpi-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--sp-2); }
  @media (max-width: 900px) { .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .adm-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 880px; }
  .adm-table th { text-align: left; font-weight: 600; color: var(--fg-muted); font-size: 11px;
    padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .adm-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle;
    white-space: nowrap; }
  .adm-table tr:last-child td { border-bottom: 0; }
  .adm-table .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .adm-table input[type="number"], .adm-table select, .adm-table input[type="text"] {
    height: 30px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r-sm);
    background: var(--surface); color: var(--fg); font: inherit; font-size: 12px; }
  .adm-table input[type="number"] { width: 84px; text-align: right; }
  .adm-table .ops { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }
  .adm-table .ops .btn { white-space: nowrap; }
  .scroll-x { overflow-x: auto; }
  .quota-bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 56px; }
  .quota-bar > i { display: block; height: 100%; background: var(--primary); }
  .quota-bar.warn > i { background: var(--warn); }
  .quota-bar.bad > i { background: var(--danger); }
  .bars { display: grid; gap: 6px; font-size: 12px; }
  .bars .row { display: grid; grid-template-columns: 96px 1fr 76px; align-items: center; gap: 8px; }
  .bars .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-muted); }
  .bars .row .track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bars .row .track > i { display: block; height: 100%; background: var(--primary); }
  .bars .row .amt { text-align: right; font-variant-numeric: tabular-nums; }
  .days { display: flex; align-items: flex-end; gap: 5px; height: 96px; }
  .days .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; }
  .days .col i { width: 100%; border-radius: 3px 3px 0 0; background: var(--primary-soft); min-height: 2px; }
  .days .col em { font-size: 9.5px; color: var(--fg-subtle); font-style: normal; }
  /* ---- 图表面板（7.6：曲线图 + 柱状图，纯 SVG，不引外部库） ---- */
  .chart-row { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: var(--sp-4); }
  .chart-row.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 980px) { .chart-row, .chart-row.even { grid-template-columns: 1fr; } }
  .chart { position: relative; min-height: 120px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; fill: none; stroke: none; }
  /* aurora.css 有全局 `svg { fill:none; stroke:currentColor }`（给图标用的），
     不覆盖的话柱状图会变成白描边空框 —— 图表里的形状统一用类名接管 */
  .chart svg .c-grid { fill: none; stroke: #ffffff12; stroke-width: 1; }
  .chart svg .c-text { fill: #8f88a8; stroke: none; font-size: 9.5px; font-family: inherit; }
  .chart svg .c-text.cost { fill: #4fd6a3; }
  .chart svg .c-area { fill: url(#areaFill); stroke: none; }
  .chart svg .c-line-a { fill: none; stroke: #8f7dff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .chart svg .c-line-b { fill: none; stroke: #4fd6a3; stroke-width: 1.8; stroke-dasharray: 5 4; stroke-linejoin: round; }
  .chart svg .c-dot-a { fill: #0d0d16; stroke: #8f7dff; stroke-width: 1.8; }
  .chart svg .c-dot-b { fill: #0d0d16; stroke: #4fd6a3; stroke-width: 1.5; }
  .chart svg .c-bar { fill: #8f7dff; fill-opacity: .86; stroke: none; }
  .chart svg .c-bar:hover { fill-opacity: 1; }
  .chart svg .c-hit { fill: transparent; stroke: none; }
  .chart svg .c-cursor { fill: none; stroke: #ffffff2e; stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .tip {
    position: absolute; z-index: 5; pointer-events: none; opacity: 0;
    transform: translate(-50%, -108%); transition: opacity .12s ease;
    padding: 6px 9px; border-radius: 8px; font-size: 11px; line-height: 1.45;
    background: rgba(12, 12, 20, .92); color: #ece8ff; border: 1px solid #ffffff1f;
    box-shadow: 0 10px 26px -14px #000; white-space: nowrap;
  }
  .chart .tip.on { opacity: 1; }
  .chart .empty-chart { display: grid; place-items: center; min-height: 140px; color: var(--fg-subtle); font-size: 12px; }
  .chart-legend { display: flex; gap: 12px; align-items: center; margin-left: auto; font-size: 10.5px; color: var(--fg-muted); }
  .chart-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .chart-legend i.line { width: 14px; height: 3px; border-radius: 2px; }
  /* 横向柱状图（款式 / 颜色 / 模型） */
  .hbar {
    display: grid; grid-template-columns: 112px minmax(0, 1fr) 54px 74px;
    align-items: center; gap: 8px; padding: 4px 0; font-size: 11.5px;
  }
  .hbar + .hbar { border-top: 1px solid #ffffff08; }
  .hbar-label { color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-track { height: 10px; border-radius: 999px; background: #ffffff0d; overflow: hidden; }
  .hbar-track > i {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #8f7dff, #a99bff);
    box-shadow: 0 0 14px -4px #8f7dffaa;
  }
  .hbar-value { text-align: right; font-variant-numeric: tabular-nums; color: #ded7f0; }
  .hbar-value em { font-style: normal; color: var(--fg-subtle); font-size: 10px; }
  .hbar-cost { text-align: right; font-variant-numeric: tabular-nums; color: #7ddfb8; }
  @media (max-width: 620px) { .hbar { grid-template-columns: 84px minmax(0, 1fr) 46px; } .hbar-cost { display: none; } }
  .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
  @media (max-width: 760px) { .form-grid { grid-template-columns: 1fr; } }
  .form-grid label { display: grid; gap: 4px; font-size: 11px; color: var(--fg-muted); }
  .form-grid input, .form-grid select { height: 32px; padding: 0 8px; border: 1px solid var(--border);
    border-radius: var(--r-sm); background: var(--surface); color: var(--fg); font: inherit; font-size: 12px; }
  .badge-role { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--fg-muted); }
  .badge-role.admin { background: var(--primary-soft); color: var(--primary-hover); }
  .badge-role.off { background: var(--warn-soft); color: var(--warn); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16 5.5a3 3 0 010 5.6"/><path d="M18 14.6c2 .6 3.4 2.4 3.4 5.4"/></symbol>
  <symbol id="i-coins" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v5c0 1.7 2.7 3 6 3s6-1.3 6-3V7"/><path d="M15 12v5c0 1.7 2.7 3 6 3"/><ellipse cx="18" cy="17" rx="3" ry="1.6"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
</svg>

<header class="appbar">
  <div class="brand">
    <span class="brand-mark"><svg width="18" height="18"><use href="#i-shield"/></svg></span>
    <div class="brand-text">
      <h1>管理后台</h1>
      <p id="subLine">账号 / 额度 / 用量总览（数据来自飞书多维表格）</p>
    </div>
  </div>
  <div class="appbar-spacer"></div>
  <div class="appbar-meta">
    <a class="btn btn-ghost" href="/">返回工作台</a>
    <span class="who-chip" id="whoChip">
      <b id="whoName">—</b>
      <button class="who-out" id="logoutBtn" type="button" title="退出登录" aria-label="退出登录">×</button>
    </span>
  </div>
</header>

<main class="admin-shell">
  <section class="kpi-row" id="kpis"></section>

  <section class="chart-row">
    <section class="panel">
      <div class="panel-head">
        <h2>用量趋势</h2>
        <span class="chart-legend">
          <span><i class="line" style="background:#8f7dff"></i>张数</span>
          <span><i class="line" style="background:#4fd6a3"></i>花费</span>
        </span>
      </div>
      <div class="panel-body"><div class="chart" id="trendChart"></div></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>今日每小时产出</h2><span class="hint" id="hourHint">今天</span></div>
      <div class="panel-body"><div class="chart" id="hourChart"></div></div>
    </section>
  </section>

  <section class="chart-row even">
    <section class="panel">
      <div class="panel-head"><h2>按款式</h2><span class="hint">柱长 = 张数，右侧为花费</span></div>
      <div class="panel-body"><div class="chart" id="styleChart"></div></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>按颜色</h2><span class="hint">柱长 = 张数，右侧为花费</span></div>
      <div class="panel-body"><div class="chart" id="colorChart"></div></div>
    </section>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>用量排行（按账号）</h2><span class="hint" id="usageHint">—</span></div>
    <div class="panel-body"><div class="bars" id="byAccount"></div></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>模型用量</h2><span class="hint">柱长 = 张数，右侧为花费</span></div>
    <div class="panel-body"><div class="chart" id="modelChart"></div></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>新建子账号</h2>
      <span class="hint">建好即可登录；额度元填 0 = 不限</span>
    </div>
    <div class="panel-body">
      <form class="form-grid" id="createForm">
        <label>账号<input name="username" required placeholder="如 zhangsan" autocomplete="off" /></label>
        <label>初始密码<input name="password" required minlength="6" placeholder="至少 6 位" autocomplete="new-password" /></label>
        <label>显示名<input name="display" placeholder="张三" /></label>
        <label>角色
          <select name="role">
            <option value="member">成员（只能做图）</option>
            <option value="admin">管理员（可进本页）</option>
          </select>
        </label>
        <label>额度元<input name="quota" type="number" step="0.01" min="0" value="0" /></label>
        <label>备注<input name="note" placeholder="部门 / 用途" /></label>
        <div><button class="btn btn-primary" type="submit">创建账号</button></div>
      </form>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>账号管理</h2>
      <span class="hint" id="accountsHint">—</span>
      <button class="btn btn-quiet btn-sm" type="button" id="reloadBtn" style="margin-left:auto">刷新</button>
    </div>
    <div class="panel-body scroll-x">
      <table class="adm-table">
        <thead>
          <tr>
            <th>账号</th><th>显示名</th><th>角色</th><th>状态</th>
            <th class="num">额度元</th><th class="num">已用</th><th>额度</th>
            <th class="num">张数</th><th class="num">次数</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="accountRows"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>最近记录</h2><span class="hint">最新 20 条，含飞书附件里同步过来的成品</span></div>
    <div class="panel-body scroll-x">
      <table class="adm-table">
        <thead><tr><th>时间</th><th>账号</th><th>款式</th><th>成品</th><th>模型</th><th class="num">张数</th><th class="num">金额</th><th>任务</th></tr></thead>
        <tbody id="recentRows"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="toasts" id="toasts" aria-live="assertive"></div>
<script src="/admin.js?v=7.6.1"></script>
</body>
</html>
