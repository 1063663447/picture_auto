# Render Blueprint —— 曾经用来把工作台部署成免费 Web Service
#
# ⚠️ 已停用（2026-11）：现在只跑本地，双击 workbench\run.bat 就行。
#    线上实例已 suspend、autoDeploy 已关（git push 不会触发重建）。
#    要恢复：Render 控制台点 Resume（或 POST /v1/services/<id>/resume），再把 autoDeploy 改回 true。
#
# 原用法：
#   1) 把整个仓库（picture_auto：含 workbench/ 与 apparel-style-recolor/）推到 GitHub
#   2) Render 控制台 → New → Blueprint → 选这个仓库 → Apply
#   3) 在 Environment 里填 .env 的同名变量（TERRA_API_KEY / DEEPSEEK_API_KEY 等）
#
# 免费版限制（也是停用的原因）：
#   - 无持久盘：data/（原图、成品、ZIP）在重启/重新部署后清空
#   - 闲置 15 分钟休眠，冷启动 30~60s
#   - 512MB 内存 + 每月出口流量上限：大图 + 高并发很容易撞墙
#   - 生图单张 30~120s，属于正常长请求

services:
  - type: web
    name: apparel-recolor-workbench
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./workbench/deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
